name: FinPreclear CPU Tests

on:
  push:
    branches:
      - review/security-hardening-20261024
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: finpreclear-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'pydantic>=2,<3' 'fastapi>=0.110' 'httpx>=0.27' 'pyarrow>=15' 'pytest>=8' 'uvicorn>=0.29'
      - name: Validate security configuration
        run: |
          python - <<'PY'
          import json
          from finguard.gateway.service import validate_action_types, action_config
          cfg = json.load(open('configs/action_types.json'))
          validate_action_types(cfg)
          for tool in ('get_invoice', 'lookup_vendor'):
              assert action_config(cfg, tool)['fail_mode'] == 'escalate', tool
          print('Both financial read tools use fail_mode=escalate')
          PY
      - name: Verify beta release gates remain closed
        run: |
          python -m scripts.beta_readiness > beta-readiness.json
          python - <<'PY'
          import json
          with open('beta-readiness.json') as f:
              report = json.load(f)
          assert report['production_beta_authorized'] is False
          assert report['blockers']
          print('Production release remains gated; preview-only development permitted')
          PY
      - name: Run CPU regression suite
        run: python -m pytest -q tests --junitxml=test-results.xml
      - name: Publish test summary
        if: always()
        run: |
          if [ -f test-results.xml ]; then
            python - <<'PY'
          import xml.etree.ElementTree as ET
          x = ET.parse('test-results.xml').getroot()
          suites = list(x.iter('testsuite'))
          print('tests=', sum(int(s.get('tests', '0')) for s in suites), 'failures=', sum(int(s.get('failures', '0')) for s in suites), 'errors=', sum(int(s.get('errors', '0')) for s in suites), 'skipped=', sum(int(s.get('skipped', '0')) for s in suites))
          PY
          fi
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cpu-test-results
          path: |
            test-results.xml
            beta-readiness.json
          if-no-files-found: ignore
